<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Secretary - 自分専用の秘書</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>My Secretary</h1>
      <p id="greeting" class="greeting"></p>
    </header>

    <main class="grid">
      <!-- Tasks -->
      <section class="card">
        <h2>今日のタスク</h2>
        <form id="task-form" class="input-row">
          <input type="text" id="task-input" placeholder="やることを入力..." required>
          <button type="submit">追加</button>
        </form>
        <ul id="task-list" class="item-list"></ul>
      </section>

      <!-- Schedule / Reminders -->
      <section class="card">
        <h2>スケジュール・リマインダー</h2>
        <div id="notification-status" class="notification-status"></div>
        <form id="schedule-form" class="input-row">
          <input type="time" id="schedule-time" required>
          <input type="text" id="schedule-input" placeholder="予定を入力..." required>
          <button type="submit">追加</button>
        </form>
        <ul id="schedule-list" class="item-list"></ul>
      </section>

      <!-- Notes -->
      <section class="card">
        <h2>メモ</h2>
        <form id="note-form" class="input-row">
          <input type="text" id="note-input" placeholder="メモを入力..." required>
          <button type="submit">追加</button>
        </form>
        <ul id="note-list" class="item-list"></ul>
      </section>

      <!-- Cloud Sync -->
      <section class="card">
        <h2>クラウド同期(Google ドライブ)</h2>
        <div id="sync-message" class="notification-status"></div>

        <div id="sync-setup">
          <p class="hint-text">
            Google ドライブと同期するには、あなた自身の Google Cloud プロジェクトで
            発行した OAuth クライアントIDが必要です。設定方法は README を参照してください。
          </p>
          <form id="sync-clientid-form" class="input-row">
            <input type="text" id="sync-clientid-input" placeholder="Google Client ID を入力...">
            <button type="submit">保存</button>
          </form>
        </div>

        <div id="sync-controls">
          <button id="sync-signin-btn" type="button">Googleでログイン</button>
          <div id="sync-actions" class="input-row">
            <button id="sync-upload-btn" type="button">⬆ アップロード</button>
            <button id="sync-download-btn" type="button">⬇ ダウンロード</button>
            <button id="sync-signout-btn" type="button" class="secondary-btn">ログアウト</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="drive-sync.js"></script>
</body>
</html>
